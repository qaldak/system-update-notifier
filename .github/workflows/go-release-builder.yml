name: Go Release Builder

# Builds the binaries with GoReleaser and attaches them to the GitHub release of a tag.
# Normally called by release.yml after semantic-release created a new version.
# Can be started manually (Actions -> Go Release Builder -> Run workflow) to
# re-build the assets of an existing tag, e.g. after a failed run.
on:
  workflow_call:
    inputs:
      tag:
        description: "Tag to build, e.g. 1.2.27"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, e.g. 1.2.27"
        required: true
        type: string

permissions:
  contents: write

jobs:
  go-release-builder:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable

      - name: GoReleaser Action
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
